<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossWizz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #canvas-container {
            position: relative;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <!-- For PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <!-- ── Firebase SDKs (must load first) ── -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- ── Shared auth helpers (from your /shared/ folder) ── -->
    <!-- Uncomment these when deploying with the hub:
    <script src="../shared/firebase.js"></script>
    <script src="../shared/auth.js"></script>
    -->

    <!-- ── Game modules (load order matters!) ── -->
    <script src="js/config.js"></script>        <!-- Level definitions, constants          -->
    <script src="js/audio.js"></script>         <!-- Music, SFX, AudioContext              -->
    <script src="../shared/firebase.js"></script> <!-- Firebase config                 -->
    <script src="../shared/auth.js"></script>  <!-- Auth helpers (must load before main)   -->
    <script src="js/firebase.js"></script> <!-- Save / load via Firestore             -->
    <script src="js/ui.js"></script>            <!-- HUD: points, health, timer, etc.      -->
    <script src="js/tiles.js"></script>         <!-- Tile rendering + math question logic  -->
    <script src="js/particles.js"></script>     <!-- Combo floating-text particles         -->
    <script src="js/scenes/menu.js"></script>   <!-- Main menu screen                      -->
    <script src="js/scenes/levelSelect.js"></script> <!-- Level-picker screen              -->
    <script src="js/scenes/game.js"></script>   <!-- Core game scene                       -->
    <script src="js/scenes/how.js"></script>    <!-- "How to Play" screen                  -->
    <script src="js/scenes/states.js"></script> <!-- Player stats screen                   -->
    <script src="js/scenes/admin.js"></script>  <!-- Admin panel (admin-only)              -->
    <script src="js/main.js"></script>          <!-- Game loop — must be last              -->
</body>
</html>
